<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SI1 — Stop it!</title>
<link rel="stylesheet" href="../../../../../plugin/skills/course-module-ui/templates/gb_tokens.css">
<link rel="stylesheet" href="../../gb_lab.css">
<style>
  /* the clip fills the stage; the frame freezes on STOP and the trainee points at what they saw */
  .si-video { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; max-width: none !important; object-fit: cover; background: #000; }
  .si-count { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; font: 900 120px/1 var(--tl-font, sans-serif);
    color: #fff; text-shadow: 0 0 40px rgba(46,182,248,.8); display: none; }
  .si-count.on { display: block; animation: si-pop .9s ease-out; }
  @keyframes si-pop { from { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .si-rec { position: absolute; bottom: 16px; left: 12px; z-index: 3; display: none; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,.55); color: #fff; font: 800 13px var(--tl-mono, monospace); letter-spacing: .14em; }
  .si-rec i { width: 10px; height: 10px; border-radius: 50%; background: #FF3B30; animation: tl-pulse 1s steps(2, start) infinite; }
  .si-rec.on { display: flex; }
  .si-tap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; display: none; cursor: crosshair; }
  .si-tap.on { display: block; box-shadow: inset 0 0 0 4px rgba(242,179,61,.85); }
  .si-ring { position: absolute; z-index: 3; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; display: none; pointer-events: none;
    border: 4px solid #F2B33D; box-shadow: 0 0 0 6px rgba(242,179,61,.25), 0 0 30px rgba(242,179,61,.8); animation: g3-breathe 1.4s ease-in-out infinite; }
  .si-ring.on { display: block; }
  .si-ring.mine { border-color: #2EB6F8; box-shadow: 0 0 0 6px rgba(46,182,248,.25); animation: none; width: 56px; height: 56px; margin: -28px 0 0 -28px; }
  @keyframes g3-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .si-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; z-index: 3; background: rgba(255,255,255,.15); }
  .si-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2EB6F8, #34E0C4); }
  .si-rounds { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .si-rounds li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 15px; }
  .si-rounds li b { margin-left: auto; font: 700 15px var(--tl-mono, monospace); }
  .si-rounds li.now { box-shadow: inset 0 0 0 1.5px var(--tl-accent); }
  .si-act { display: grid; gap: 8px; }
  .si-coach { margin: 0; font-size: 15.5px; line-height: 1.45; min-height: 44px; }
</style>
</head>
<body>
<div class="tl" id="tl">
  <div class="tl-ask"><span class="tl-eye">Watch · Manifold during loading · hazard spotting</span>You are on manifold watch. The moment something goes wrong - press STOP!
    <small>The highlighted line always says what to do next.</small></div>
  <div class="tl-body">
    <div class="tl-stage" id="stage">
      <div class="tl-scene" id="scene" data-aspect="16:9">
        <video class="si-video" id="vid" playsinline muted preload="auto"></video>
        <div class="si-tap" id="tap" data-tap="1"></div>
        <div class="si-ring" id="ring"></div>
        <div class="si-ring mine" id="mine"></div>
        <div class="si-count" id="count"></div>
        <div class="si-rec" id="rec"><i></i>LIVE · MANIFOLD CAM</div>
        <div class="si-bar"><i id="bar"></i></div>
      </div>
    </div>
    <aside class="tl-side">
      <div class="tl-card"><h3>What happened</h3><p class="si-coach" id="coach">The clip runs once, like real life.</p></div>
      <div class="tl-card" id="actCard" hidden><h3>What do you do first?</h3><div class="si-act" id="acts"></div></div>
      <div class="tl-card"><h3>Your watch</h3><ul class="si-rounds" id="rounds"></ul></div>
      <button type="button" class="tl-btn" id="snd">Sound: off</button>
    </aside>
  </div>
  <div class="tl-bar"><button type="button" class="tl-go">Start watching</button></div>
</div>

<script src="../../gb_lab.js"></script>
<script>
(function () {
  'use strict';
  GBLab.init({ code: 'SI1', title: 'Stop it!', mode: 'self' });

  /* Each clip: when the hazard starts (measured on the clip frame by frame - the picture changes
     from 4.3 s), where it is in the picture (% of the frame), and the first action. The first
     action follows ICS TSG(LG) 2018 emergency response at the manifold (raise the alarm, stop
     cargo, ESD) - VERIFY against the ship's own emergency plan. Right answers are keys only. */
  var CLIPS = [
    { id: 'c1', src: '../img/p2_clip1.webm', dur: 10, at: 4.3, where: { x: 48, y: 72, r: 16 },
      what: 'vapour and frost growing on a flange joint at the manifold - a liquid leak',
      acts: [['Raise the alarm and have the cargo control room stop the transfer (ESD)', 'ea2ef0ed'],
             ['Walk up to the flange to see where the vapour comes from', '85f57cd6'],
             ['Tighten the flange bolts while the cargo is running', 'a19ccdb9']] }
  ];
  var vid = document.getElementById('vid'), tap = document.getElementById('tap'), ring = document.getElementById('ring'), mine = document.getElementById('mine');
  var i = 0, R = [], cur = null, state = 'ready', sure = null, soundOn = false;

  function coach(s) { document.getElementById('coach').textContent = s; }
  /* ---- always clear: what to do now, a hint, the opening card -------------------------------------- */
  var tall = window.matchMedia ? window.matchMedia('(max-aspect-ratio: 1/1)') : { matches: false };
  function step() {
    var side = tall.matches ? 'below' : 'on the right';
    var N = { ready: ['Press <b>Start watching</b> - the camera goes live', ''], count: ['Get ready…', ''],
      play: ['Watch the manifold. Press <b>STOP!</b> the moment something goes wrong', ''],
      locate: ['Tap the picture <b>right where</b> you saw it', 'warn'],
      act: [cur && cur.act ? 'Press <b>Confirm</b>' : 'Choose what you do first - ' + side, 'warn'], review: ['', ''] }[state] || ['', ''];
    GBLab.now(N[0], N[1]); GBLab.goReady(state === 'ready' || (state === 'act' && cur && cur.act));
  }
  GBLab.hint(function () {
    if (state === 'ready') return 'Press Start watching. The clip runs once - watch it all the way.';
    if (state === 'play' || state === 'count') return 'Scan the whole picture again and again - flanges, hoses, the deck. Press STOP! as soon as something changes.';
    if (state === 'locate') return 'Tap on the place where the change started, right on it.';
    if (state === 'act') return 'Think: what stops the danger for everyone, fastest - before anyone goes near it?';
    return '';
  });
  GBLab.intro({ tag: 'Manifold watch', title: 'Cargo is loading. You are on manifold watch.',
    text: 'A camera shows the manifold live. Watch it - and act the moment something goes wrong. Pressing STOP! too early counts as a false alarm.',
    steps: ['Press <b>Start watching</b> - the camera goes live.', 'The moment something goes wrong, press <b>STOP!</b>', 'Tap the picture where you saw it.', 'Choose what you do first.'],
    start: 'I am ready' });
  function rounds() {
    document.getElementById('rounds').innerHTML = CLIPS.map(function (c, k) {
      var r = R[k];
      return '<li class="' + (k === i && !r ? 'now' : '') + '">Clip ' + (k + 1) + '<b>' + (r ? (r.caught ? (r.react.toFixed(1) + ' s') : 'missed') : k === i ? 'now' : '—') + '</b></li>';
    }).join('');
  }

  /* ---- start: 3 · 2 · 1 · live --------------------------------------------------------------- */
  function start() {
    cur = { k: i, falseStops: 0, caught: false, react: 0, placed: null, act: null };
    vid.src = CLIPS[i].src; vid.currentTime = 0; vid.muted = !soundOn;
    ring.className = 'si-ring'; mine.className = 'si-ring mine';
    state = 'count'; GBLab.go('Get ready…', null); step();
    var n = 3, el = document.getElementById('count');
    (function tick() {
      if (n === 0) { el.className = 'si-count'; return live(); }
      el.textContent = n; el.className = 'si-count'; void el.offsetWidth; el.className = 'si-count on';
      GBLab.sound.play([[660, 90, 0, 'sine']], 0.05); n--; setTimeout(tick, 800);
    })();
  }
  function live() {
    state = 'play';
    document.getElementById('rec').className = 'si-rec on';
    coach('Live. Watch the manifold.');
    GBLab.go('STOP!', stop); step();
    var p = vid.play(); if (p && p.catch) p.catch(function () { vid.muted = true; vid.play(); });
  }
  // a recorded clip may not carry its own length: the clip's known length drives the bar
  vid.addEventListener('timeupdate', function () { var d = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : CLIPS[i].dur; document.getElementById('bar').style.width = Math.min(100, vid.currentTime / d * 100) + '%'; });
  vid.addEventListener('ended', function () { if (state === 'play') missed(); });

  /* ---- STOP: too early, or caught --------------------------------------------------------------- */
  function stop() {
    if (state !== 'play') return;
    var t = vid.currentTime, c = CLIPS[i];
    if (t < c.at - 0.15) {
      cur.falseStops++;
      GBLab.toast('Nothing has gone wrong yet - false alarm. Keep watching.', 'hint');
      vid.pause(); setTimeout(function () { if (state === 'play') vid.play(); }, 700);
      return;
    }
    vid.pause();
    cur.caught = true; cur.react = Math.max(0, t - c.at);
    state = 'locate'; GBLab.go('Point at what you saw', null); step();
    document.getElementById('rec').className = 'si-rec';
    tap.className = 'si-tap on';
    GBLab.sound.play([[880, 140, 40, 'square'], [880, 140, 0, 'square']], 0.05);
    coach('Stopped at ' + t.toFixed(1) + ' s. Tap the picture where you saw it.');
  }
  function missed() {
    state = 'review'; document.getElementById('rec').className = 'si-rec';
    cur.caught = false; step();
    var c = CLIPS[i]; // the clip stops on its last frame, where the hazard is plain to see
    showRing(c);
    GBLab.show({ tag: 'Missed', kind: 'no', title: 'It went by', text: 'From ' + c.at.toFixed(1) + ' s there was ' + c.what + '. On watch, the whole manifold is scanned all the time - flanges, hoses, people.',
      buttons: [{ label: 'Next', fn: nextClip }] });
    R[i] = cur; rounds();
  }

  /* ---- point at it ------------------------------------------------------------------------------------ */
  tap.addEventListener('click', function (e) {
    if (state !== 'locate') return;
    var p = GBLab.toScene(e, document.getElementById('scene')), c = CLIPS[i];
    cur.placed = Math.sqrt(Math.pow(p.x - c.where.x, 2) + Math.pow((p.y - c.where.y) * 9 / 16, 2)) <= c.where.r;
    mine.style.left = p.x + '%'; mine.style.top = p.y + '%'; mine.className = 'si-ring mine on';
    tap.className = 'si-tap';
    showRing(c);
    state = 'act';
    coach(cur.placed ? 'Yes - that is it: ' + c.what + '.' : 'The hazard was in the ring: ' + c.what + '.');
    var box = document.getElementById('acts');
    box.innerHTML = '';
    c.acts.slice().sort(function () { return Math.random() - 0.5; }).forEach(function (a) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'tl-btn'; b.textContent = a[0];
      b.addEventListener('click', function () { [].forEach.call(box.children, function (x) { x.className = 'tl-btn'; }); b.className = 'tl-btn on'; cur.act = a; GBLab.go('Confirm', confirm); step(); });
      box.appendChild(b);
    });
    var card = document.getElementById('actCard'), aside = card.parentNode;
    card.hidden = false;
    GBLab.go('Choose what you do first', null); step();
    // on a phone the choices are under the picture: bring them into sight
    if (aside.scrollHeight > aside.clientHeight + 4) aside.scrollTop = Math.max(0, card.offsetTop - aside.offsetTop - 4);
  });
  function showRing(c) { ring.style.left = c.where.x + '%'; ring.style.top = c.where.y + '%'; ring.className = 'si-ring on'; }

  function confirm() {
    if (state !== 'act' || !cur.act) return;
    GBLab.sure(function (lvl) {
      var c = CLIPS[i], ok = GBLab.key('SI1-' + c.id, cur.act[0], 1) === cur.act[1];
      cur.actOk = ok; GBLab.sureNote(lvl, ok && cur.placed);
      R[i] = cur; rounds();
      document.getElementById('actCard').hidden = true;
      state = 'review'; step();
      GBLab.show({ img: '../img/01_drain_leak.jpg', tag: ok ? 'Right first move' : 'Not first', kind: ok ? 'ok' : 'no',
        title: ok ? 'Alarm first, then the transfer stops' : 'First the alarm and the stop',
        text: ok ? 'You caught it ' + cur.react.toFixed(1) + ' s after it began. Raising the alarm and stopping the transfer cuts the supply to the leak before anyone goes near it.'
                 : 'Going closer or working on a live flange puts a person in cold vapour while cargo still flows. The alarm and the stop come first; the leak is approached later, upwind, with the right protection.',
        buttons: [{ label: i + 1 < CLIPS.length ? 'Next clip' : 'See my result', fn: nextClip }] });
    });
  }
  function nextClip() {
    i++;
    ring.className = 'si-ring'; mine.className = 'si-ring mine';
    if (i < CLIPS.length) { state = 'ready'; rounds(); coach('Next clip.'); GBLab.go('Start watching', start); step(); return; }
    result();
  }
  function result() {
    var items = [];
    R.forEach(function (r, k) {
      var c = CLIPS[r.k];
      items.push({ t: 'Clip ' + (k + 1) + ': caught it', ok: r.caught, a: r.caught ? r.react.toFixed(1) + ' s after it began' : 'missed', c: 'within 3 s', w: 'Every second counts: ' + c.what + '.' });
      items.push({ t: 'Clip ' + (k + 1) + ': caught it fast (under 2 s)', ok: r.caught && r.react < 2, a: r.caught ? r.react.toFixed(1) + ' s' : 'missed', c: 'under 2 s', w: 'A watch that scans the whole picture sees the first wisp, not the cloud.' });
      items.push({ t: 'Clip ' + (k + 1) + ': no false alarm', ok: r.falseStops === 0, a: r.falseStops + ' false stop(s)', c: 'none', w: 'A watch that cries wolf is not believed.' });
      items.push({ t: 'Clip ' + (k + 1) + ': pointed at the right place', ok: !!r.placed, a: r.placed ? 'on it' : 'elsewhere', c: 'the flange joint', w: 'Knowing where it is tells the cargo control room what to isolate.' });
      items.push({ t: 'Clip ' + (k + 1) + ': the right first action', ok: !!r.actOk, a: r.act ? r.act[0] : 'none', c: 'alarm and stop the transfer', w: 'Alarm and stop first; the leak is approached later, upwind, protected.' });
    });
    GBLab.finish({ items: items });
  }

  document.getElementById('snd').addEventListener('click', function () {
    soundOn = !soundOn; vid.muted = !soundOn; this.textContent = 'Sound: ' + (soundOn ? 'on' : 'off'); this.className = 'tl-btn' + (soundOn ? ' on' : '');
  });
  rounds();
  GBLab.go('Start watching', start); step();
  // the first frame shows before the start, so the trainee sees the place, not a black box
  vid.src = CLIPS[0].src; vid.addEventListener('loadeddata', function once() { vid.removeEventListener('loadeddata', once); if (state === 'ready') try { vid.currentTime = 0.05; } catch (e) {} });
})();
</script>
</body>
</html>
