<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>audit_drawing fixture</title>
<!-- test_audit_drawing.py opens this in headless Chrome. Each <svg> is one case: its id says what audit_drawing.js
     must find in it (bad-*) or must stay silent on (good-*). Drawn after the IGF pilot's real defects (L54). -->
<style>
  body{margin:0;padding:20px;font-family:sans-serif;background:#fff}
  svg{display:block;width:480px;height:auto;margin:0 0 24px;border:1px dashed #ccc}
  text{font:600 7px sans-serif}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="hull-g"><path d="M5 10 H95 L90 50 H25 L8 40 Z" fill="#fff" stroke="#0A2463" stroke-width="1"/></g>
  </defs>
</svg>

<!-- 1 a room drawn as a rectangle in a hull whose stern slopes: its corner pokes out (the M01 summary drawing) -->
<svg id="bad-inside" viewBox="0 0 100 60">
  <path d="M5 10 H95 L90 50 H25 L8 40 Z" fill="#fff" stroke="#0A2463" stroke-width="1"/>
  <rect id="room" x="10" y="14" width="30" height="34" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
</svg>

<!-- 2 the same through a shared hull drawn with <use> -->
<svg id="bad-use" viewBox="0 0 100 60">
  <use href="#hull-g"/>
  <rect id="room-u" x="10" y="14" width="30" height="34" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
</svg>

<!-- 3 a tank cut off at the drawing's right edge (the M02 fuel tank) -->
<svg id="bad-cut" viewBox="0 0 100 60">
  <rect x="5" y="5" width="40" height="40" fill="#eef" stroke="#0A2463" stroke-width="1"/>
  <circle id="tank" cx="92" cy="30" r="14" fill="#fff" stroke="#0A2463" stroke-width="1.2"/>
</svg>

<!-- 4 a ring that only shows in a later step, cut off at the top (the M02 vent-mast zone) -->
<svg id="bad-later" viewBox="0 0 100 60">
  <rect x="5" y="20" width="90" height="35" fill="#eef" stroke="#0A2463" stroke-width="1"/>
  <circle id="zone" cx="50" cy="8" r="14" fill="none" stroke="#E9A51E" stroke-width="1.5" opacity="0"/>
</svg>

<!-- 5 a label printed over a line (the M02 "FPR entrance" over the deckhouse) -->
<svg id="bad-text-over" viewBox="0 0 100 60">
  <path d="M5 30 H95" stroke="#0A2463" stroke-width="1.5" fill="none"/>
  <text id="over" x="30" y="32">open deck</text>
</svg>

<!-- 6 a label touching the edge of its own box (the M02 "drip tray · open to the air") -->
<svg id="bad-text-edge" viewBox="0 0 100 60">
  <rect x="10" y="10" width="46" height="20" fill="#fff" stroke="#0A2463" stroke-width="1"/>
  <text id="edge" x="11" y="27">drip tray · open air</text>
</svg>

<!-- 7 clean: the room follows the slope, the pipe through the bulkhead is marked, a roof overhangs its
     deckhouse, the liquid is clipped to its tank, the label keeps its clearance, a leader line ends at its label -->
<svg id="good" viewBox="0 0 100 64">
  <defs><clipPath id="tank-clip"><rect x="52" y="22" width="34" height="20" rx="10"/></clipPath></defs>
  <path d="M5 14 H95 L90 54 H25 L8 44 Z" fill="#fff" stroke="#0A2463" stroke-width="1"/>
  <path d="M12 18 H44 V50 H28 L12 41 Z" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <text x="16" y="31">Engine</text>
  <path d="M44 32 H52" stroke="#E9A51E" stroke-width="2" data-may-cross/>
  <rect x="52" y="22" width="34" height="20" rx="10" fill="#fff" stroke="#0A2463" stroke-width="1"/>
  <rect x="52" y="34" width="34" height="8" fill="#9fd" clip-path="url(#tank-clip)"/>
  <rect x="60" y="4" width="20" height="10" fill="#E7EBF0" stroke="#0A2463" stroke-width="0.8"/>
  <rect x="58" y="2.6" width="24" height="2.8" fill="#0A2463"/>
  <path d="M6 61 H40" stroke="#ccc" stroke-width="0.6" fill="none" data-no-contain/>
</svg>

<!-- 8 clean through <use>: the shared hull holds a room drawn along its slope -->
<svg id="good-use" viewBox="0 0 100 60">
  <use href="#hull-g"/>
  <path d="M12 14 H44 V47 H28 L12 38 Z" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <text x="16" y="27">Engine</text>
  <rect x="52" y="18" width="30" height="18" rx="8" fill="#fff" stroke="#0A2463" stroke-width="1"/>
  <text x="54" y="45">fuel tank</text>
  <rect x="60" y="1" width="20" height="8" fill="#E7EBF0" stroke="#0A2463" stroke-width="0.8"/>
  <path d="M6 56 H40" stroke="#ccc" stroke-width="0.6" fill="none" data-no-contain/>
</svg>

<!-- 9 a drawing that leaves most of its frame blank (the M01 s04 ship and the M02 s04 pipe on a large panel) -->
<svg id="bad-empty" viewBox="0 0 100 60">
  <rect id="lonely" x="4" y="4" width="18" height="10" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <text x="5" y="20">one valve</text>
</svg>

<!-- 10 a drawing that fills its frame: parts and labels spread over it -->
<svg id="good-full" viewBox="0 0 100 60">
  <rect x="4" y="4" width="26" height="16" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <rect x="38" y="4" width="26" height="16" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <rect x="72" y="4" width="24" height="16" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <path d="M8 30 H92" stroke="#0A2463" stroke-width="2" fill="none"/>
  <text x="6" y="40">tank</text><text x="40" y="40">valve</text><text x="74" y="40">engine</text>
  <rect x="4" y="44" width="26" height="12" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <rect x="38" y="44" width="26" height="12" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
  <rect x="72" y="44" width="24" height="12" fill="#eef" stroke="#0A2463" stroke-width="0.8"/>
</svg>

<pre id="out"></pre>
<script src="../scripts/audit_drawing.js"></script>
<script>
  console.log = function () {};
  var res = AuditDrawing.page();
  document.getElementById("out").textContent = JSON.stringify({
    verdict: res.verdict,
    findings: res.findings.map(function (f) {
      var el = f.els && f.els[0], svg = el && (el.ownerSVGElement || el);
      return { check: f.check, svg: svg && svg.id, part: el && el.id, detail: f.detail };
    })
  });
</script>
</body>
</html>
