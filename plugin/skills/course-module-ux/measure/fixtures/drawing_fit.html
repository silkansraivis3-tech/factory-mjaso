<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gb_fit fixture</title>
<!-- test_audit_drawing.py: gb_fit.js must widen the frame of a drawing that reaches past it, leave a drawing
     that fits alone, and leave data-fit="off" alone. -->
<style>body{margin:0;padding:20px}svg{display:block;width:400px;height:auto}</style>
</head>
<body>
<svg id="spills" viewBox="0 0 100 60"><rect x="10" y="10" width="40" height="40" fill="#eef"/><circle cx="96" cy="-4" r="12" fill="#f90"/></svg>
<svg id="fits" viewBox="0 0 100 60"><rect x="10" y="10" width="40" height="40" fill="#eef"/></svg>
<svg id="off" viewBox="0 0 100 60" data-fit="off"><circle cx="96" cy="30" r="12" fill="#f90"/></svg>
<pre id="out"></pre>
<script src="../../assets/gb_fit.js"></script>
<script>
  setTimeout(function () {
    var o = {};
    ["spills", "fits", "off"].forEach(function (id) { o[id] = document.getElementById(id).getAttribute("viewBox"); });
    document.getElementById("out").textContent = JSON.stringify(o);
  }, 300);
</script>
</body>
</html>
