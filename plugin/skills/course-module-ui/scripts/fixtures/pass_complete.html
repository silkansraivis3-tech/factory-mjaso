<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PASS fixture — every class has a rule</title>
<!-- The same screen, linking the real canonical shell AND the composition
     layer. Both are needed: 2.3.0 split gb_shell.css so the frame and what sits
     on it have one owner each, which moved .law, .warnbox, .fin, .cap, .src and
     the table rules into gb_compose.css. This fixture kept linking only the
     shell and started reporting 8 defects - correctly. The fixture was stale,
     not the checker. A fixture is only a control if it is kept current.
     It also carries a superscript and a subscript, so it proves the canonical system
     sets a floor for them - that rule was lost once when the per-course dialects were
     retired, and a real course shipped 28 superscripts at 10.4 px before anyone looked.
     EXPECT: no findings.
     The <g class="fx-group"> is a drawing-structure class and must be reported
     as a note, never as a defect. -->
<link rel="stylesheet" href="../../templates/gb_tokens.css">
<link rel="stylesheet" href="../../templates/gb_shell.css">
<link rel="stylesheet" href="../../templates/gb_compose.css">
</head>
<body>
<div class="slide">
  <div class="slide-body">
    <p class="lead">A screen that reads correctly in the source and renders correctly.</p>
    <div class="law"><p>Regulation text.</p><p class="ref">SOLAS II-2</p></div>
    <div class="warnbox"><p><b>Hazard.</b> Do not energise.</p></div>
    <svg class="fig" viewBox="0 0 100 40"><g class="fx-group"><rect x="2" y="2" width="40" height="20"/></g></svg>
    <p class="cap">A drawing.</p>
    <p class="cap">2 M&Omega; = 2 &times; 10<sup>6</sup> &Omega; · R<sub>ie</sub></p>
    <p class="src">Source: the programme. <small>Edition 2026.</small></p>
    <p class="fin">Block complete.</p>
  </div>
</div>
</body>
</html>
